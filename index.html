<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // tema antes de qualquer CSS e da primeira pintura (sem clarão): a escolha salva ou,
      // sem ela, o tema do Windows. Mesma regra de src/theme.js.
      {
        let tema = null;
        try {
          tema = localStorage.getItem('forgia.tema');
        } catch {}
        if (tema !== 'claro' && tema !== 'escuro') tema = matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro';
        document.documentElement.setAttribute('data-tema', tema);
      }
    </script>
    <title>Forgia</title>
    <meta name="description" content="Forgia: editor 3D para criar peças e projetos para impressão 3D." />
    <link rel="icon" type="image/x-icon" href="./branding/forgia-forge-v1.ico" sizes="16x16 24x24 32x32 48x48 64x64 128x128 256x256" />
    <link rel="icon" type="image/svg+xml" href="./branding/forgia-forge-v1.svg" sizes="any" />
  </head>
  <body>
    <!-- textos vêm de src/textos: data-t (texto), data-t-aria (aria-label), data-t-placeholder -->
    <div id="app">
      <header id="topbar">
        <a class="logo" href="#" data-t-aria="app.nome">
          <img class="logo-symbol" src="./branding/forgia-forge-v1.svg" width="26" height="26" alt="" />
          <span class="logo-wordmark" data-t="app.nome"></span>
        </a>
        <button class="icon-btn grid-btn" id="btn-new" data-t-aria="barra.novo" data-dica="novo"></button>
        <input id="design-name" class="design-name" spellcheck="false" />
        <div class="spacer"></div>
        <button class="text-btn" id="btn-import" data-t="barra.importar"></button>
        <button class="text-btn" id="btn-export" data-t="barra.exportar"></button>
        <button class="text-btn" id="btn-help" data-t="barra.atalhos"></button>
        <span class="tb-sep"></span>
        <button class="icon-btn" id="btn-theme"></button>
      </header>

      <div id="toolbar">
        <div class="tb-group">
          <button class="icon-btn" data-cmd="copy" data-t-aria="ferramentas.copy" data-dica="copy"></button>
          <button class="icon-btn" data-cmd="paste" data-t-aria="ferramentas.paste" data-dica="paste"></button>
          <button class="icon-btn" data-cmd="duplicate" data-t-aria="ferramentas.duplicate" data-dica="duplicate"></button>
          <button class="icon-btn" data-cmd="delete" data-t-aria="ferramentas.delete" data-dica="delete"></button>
          <span class="tb-sep"></span>
          <button class="icon-btn" data-cmd="undo" data-t-aria="ferramentas.undo" data-dica="undo"></button>
          <button class="icon-btn" data-cmd="redo" data-t-aria="ferramentas.redo" data-dica="redo"></button>
        </div>
        <div class="tb-group">
          <button class="icon-btn" data-cmd="showAll" data-t-aria="ferramentas.showAll" data-dica="showAll"></button>
          <span class="tb-sep"></span>
          <button class="icon-btn" data-cmd="group" data-t-aria="ferramentas.group" data-dica="group"></button>
          <button class="icon-btn" data-cmd="ungroup" data-t-aria="ferramentas.ungroup" data-dica="ungroup"></button>
          <button class="icon-btn" data-cmd="align" data-t-aria="ferramentas.align" data-dica="align"></button>
          <button class="icon-btn" data-cmd="mirror" data-t-aria="ferramentas.mirror" data-dica="mirror"></button>
          <span class="tb-sep"></span>
          <button class="icon-btn" data-cmd="draw" data-t-aria="ferramentas.draw" data-dica="draw"></button>
          <button class="icon-btn" data-cmd="cruise" data-t-aria="ferramentas.cruise" data-dica="cruise"></button>
          <button class="icon-btn" data-cmd="measure" data-t-aria="ferramentas.measure" data-dica="measure"></button>
          <button class="icon-btn" data-cmd="mark" data-t-aria="ferramentas.mark" data-dica="mark"></button>
        </div>
      </div>

      <main id="main">
        <section id="viewport">
          <div class="overlay"></div>
          <div class="nav">
            <div class="viewcube"></div>
            <div class="view-btns">
              <button class="round-btn" data-view="home" data-t-aria="vista.home" data-dica="home" data-dica-lado="direita"></button>
              <button class="round-btn" data-view="fit" data-t-aria="vista.fit" data-dica="fit" data-dica-lado="direita"></button>
              <button class="round-btn" data-view="in" data-t-aria="vista.in" data-dica="in" data-dica-lado="direita"></button>
              <button class="round-btn" data-view="out" data-t-aria="vista.out" data-dica="out" data-dica-lado="direita"></button>
              <button class="round-btn" data-view="ortho" data-t-aria="vista.ortho" data-dica="ortho" data-dica-lado="direita"></button>
            </div>
          </div>

          <div id="inspector" class="inspector hidden"></div>

          <div class="bottom-right">
            <button class="text-btn small" id="btn-settings" data-t="barra.configuracoes"></button>
            <label class="snap"><span data-t="barra.area"></span>
              <select id="area-select"></select>
            </label>
            <label class="snap"><span data-t="barra.ajustarGrade"></span>
              <select id="snap-select"></select>
            </label>
          </div>
          <div class="hint" id="hint"></div>
        </section>

        <aside id="library">
          <div class="lib-head">
            <div class="lib-title" data-t="biblioteca.titulo"></div>
            <div class="lib-controls">
              <select id="lib-category">
                <option value="basic" data-t="biblioteca.basicas"></option>
                <option value="letters" data-t="biblioteca.letras"></option>
              </select>
              <div class="lib-search">
                <span class="search-ico"></span>
                <input id="lib-search" data-t-placeholder="biblioteca.pesquisar" />
              </div>
            </div>
          </div>
          <div class="lib-grid" id="lib-grid"></div>
          <footer class="lib-foot">
            <a class="credit" href="https://larchertech.com/" target="_blank" rel="noopener noreferrer" data-t-aria="biblioteca.creditoAria">
              <img src="./branding/larchertech-lb.png" width="18" height="17" alt="" />
              <span data-t="biblioteca.credito"></span>
            </a>
          </footer>
        </aside>
      </main>

      <!-- barra de status: X/Y/Z e medidas da seleção (mm, Z para cima) e a ponte da IA -->
      <footer id="statusbar">
        <span class="sb-coords" id="sb-coords" data-t-aria="status.rotuloCentro"></span>
        <span class="sb-size" id="sb-size"></span>
        <span class="spacer"></span>
        <button class="text-btn small" id="btn-limpar-marcas" data-dica="limparMarcas" hidden></button>
        <button class="sb-ia" id="sb-ia" data-dica="ia_pronta"><span class="sb-ia-ponto"></span><span class="sb-ia-texto"></span></button>
        <button class="text-btn small" id="btn-conectar-ia" data-t="status.conectar" data-dica="conectarIA"></button>
      </footer>
    </div>

    <div id="modal-root"></div>
    <input type="file" id="file-input" accept=".stl,.obj,.3mf" hidden />
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
