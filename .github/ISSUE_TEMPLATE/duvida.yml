name: Tirar uma dúvida
description: Não sabe como fazer algo no Forgia? Pergunte aqui.
title: "[Dúvida] "
labels: ["dúvida"]
body:
  - type: markdown
    attributes:
      value: |
        Antes, vale dar uma olhada nas "Perguntas de quem está começando", no README, e no guia de uso (docs/guia-de-uso.md).
  - type: textarea
    id: objetivo
    attributes:
      label: O que você quer fazer
      description: 'Ex.: "Quero fazer um suporte de celular com furo para o cabo."'
    validations:
      required: true
  - type: textarea
    id: travou
    attributes:
      label: Onde você travou
      description: O que já tentou e em que ponto não deu certo. Um print ajuda.
    validations:
      required: true
  - type: input
    id: versao
    attributes:
      label: Versão do Forgia (se souber)
      description: Aparece no fim da janela Configurações.
      placeholder: "Forgia v0.1.1"
    validations:
      required: false
